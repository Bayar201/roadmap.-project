        <script>
            (function () {
                try {
                    var raw = localStorage.getItem('calendar:preferences');
                    var theme = raw ? JSON.parse(raw).theme : null;
                    if (theme !== 'light' && theme !== 'dark' && theme !== 'warm') {
                        theme = 'system';
                    }
                    if (theme === 'system') {
                        theme = window.matchMedia('(prefers-color-scheme: dark)').matches
                            ? 'dark'
                            : 'light';
                    }
                    document.documentElement.dataset.theme = theme;
                } catch (e) {
                    document.documentElement.dataset.theme = 'light';
                }
            })();
        </script>
        <script>
            (function () {
                try {
                    var home =
                    location.pathname === '/' &&
                    !new URLSearchParams(location.search).has('d');
                    document.documentElement.dataset.shell = home ? 'home' : 'app';
                } catch (e) {
                    document.documentElement.dataset.shell = 'app';
                }
            })();
        </script>
