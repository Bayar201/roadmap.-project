<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Changelog Component</title>
        <link rel="stylesheet" href="style.css"> 
    </head>
    <body>
        <div class="changelog-container">
            <h1>Changelog</h1>
            <p>Welcome to my changelog!</p>
            <div class="timeline">
                <div class="timeline-item">
                    <div class="timeline-date">August 3, 2028</div>
                    <div class="timeline-content">Initialising project on Frontend</div>

                </div>
                <div class="timeline-item">
                    <divclass="timeline-date">September 3, 2028</div>
                    <div class="timeline-content">Implemented awesome features on my project</div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-date">September 7, 2028</div>
                    <div class="timeline-content">Fixed several bugs and improved performance</div>
                </div>
                <div class="timeline-item">
                    <div class="timeline-date"><span>In future</span></div>
                    <div class="timeline-content">There will be new features added soon.</div>
                </div>

            </div>
            <a href="#" class="button">View More</a>

        </div>
        <script src="script.js"></script>
    </body>
</html>
