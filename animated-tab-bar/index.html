<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale = 1.0">
    <title>Animated Tab Bar </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tab-bar">
        <div class="tab active" data-tab="home">Home</div>
        <div class="tab" data-tab="CV">CV</div>
        <div class="tab" data-tab="changelog">Changelog</div>
        <div class="tab" data-tab="login">Login</div>
        <div class="tab" data-tab="articles">Articles</div>
        <div class="indicator"></div>
    </div>
    <div id="home" class="tab-content active">
        <h2>Home</h2>
        <p>Welcome to the home page</p>
    </div>
    <div id="CV" class="tab-content">
        <h2>CV</h2>
        <iframe src="../CV/index.html" title="One-page CV"></iframe>
    </div>
    <div id="changelog" class="tab-content">
        <h2>Changelog</h2>
        <p>See the latest changes to this project.</p>
        <iframe src="../changelog/index.html" title="Changelog"></iframe>
    </div>
    <div id="login" class="tab-content">
        <h2>Login</h2>
        <p>Login to get the latest news</p>
        <iframe src="../login/index.html" title="Login"></iframe>
    </div>
    <div id="articles" class="tab-content">
        <h2>Articles</h2>
        <p>Browse the latest articles.</p>
    </div>
    <script>
        const tabs = document.querySelectorAll('.tab');
        const content = document.querySelectorAll('.tab-content');
        const indicator = document.querySelector('.indicator');
        function setIndicator(tab) {
            indicator.style.width = `${tab.offsetWidth}px`;
            indicator.style.left = `${tab.offsetLeft}px`;
        }
        const activeTab = document.querySelector('.tab.active');
        setIndicator(activeTab);
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const target = tab.getAttribute('data-tab');
                content.forEach(c => {
                    c.classList.remove('active');
                    if(c.id === target) c.classList.add('active');
                });
                setIndicator(tab);
            });
        });
        window.addEventListener('resize', () => {
            const currentActive = document.querySelector('.tab.active');
            setIndicator(currentActive);
        });
    </script>
</body>
</html>
